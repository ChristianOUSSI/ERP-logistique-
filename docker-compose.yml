# docker-compose.yml  EVO-LOG SaaS Stack Complète
version: '3.9'

services:

  # ─── PostgreSQL 17 ────────────────────────────────────────
  db:
    image: postgres:17-alpine
    container_name: EVO-LOG_db
    environment:
      POSTGRES_DB:       ${DB_NAME:-evolog_erp}
      POSTGRES_USER:     ${DB_USER:-EVO-LOG}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-EVO-LOG_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_pgcrypto.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-EVO-LOG}']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis 7 ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: EVO-LOG_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret}
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  # ─── MinIO (stockage objets S3) ───────────────────────────
  minio:
    image: minio/minio:RELEASE.2026-06-04T19-20-08Z
    container_name: EVO-LOG_minio
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER:     ${MINIO_ACCESS_KEY:-EVO-LOG_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minio_secret_2026}
    volumes:
      - minio_data:/data
    ports:
      - '9000:9000'
      - '9001:9001'

  # ─── FastAPI Backend ──────────────────────────────────────
  api:
    build:
      context: ./EVO-LOG-backend
      dockerfile: Dockerfile
    container_name: EVO-LOG_api
    depends_on:
      db:    { condition: service_healthy }
      redis: { condition: service_started }
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-EVO-LOG}:${DB_PASSWORD:-EVO-LOG_secret}@db/${DB_NAME:-evolog_erp}
      REDIS_URL:    redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
    ports:
      - '8000:8000'
    volumes:
      - ./EVO-LOG-backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ─── Celery Worker ────────────────────────────────────────
  celery_worker:
    build:
      context: ./EVO-LOG-backend
      dockerfile: Dockerfile
    container_name: EVO-LOG_celery_worker
    depends_on:
      db:    { condition: service_healthy }
      redis: { condition: service_started }
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-EVO-LOG}:${DB_PASSWORD:-EVO-LOG_secret}@db/${DB_NAME:-evolog_erp}
      REDIS_URL:    redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
    volumes:
      - ./EVO-LOG-backend:/app
    command: celery -A app.celery_app.celery_app worker --loglevel=info

  # ─── Flower (Celery Monitor) ──────────────────────────────
  flower:
    image: mher/flower:3.0.1
    container_name: EVO-LOG_flower
    environment:
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
    ports:
      - '5555:5555'
    depends_on:
      redis: { condition: service_started }

  # ─── Next.js Frontend ─────────────────────────────────────
  frontend:
    build:
      context: ./EVO-LOG-frontend
      dockerfile: Dockerfile
    container_name: EVO-LOG_frontend
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000
    depends_on: [api]

volumes:
  postgres_data:
  redis_data:
  minio_data:
