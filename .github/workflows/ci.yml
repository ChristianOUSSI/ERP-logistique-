name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: EVO-LOG
          POSTGRES_PASSWORD: EVO-LOG_secret
          POSTGRES_DB: EVO-LOG_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'
        
    - name: Install dependencies
      working-directory: ./EVO-LOG-backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio httpx
        
    - name: Run Pytest
      working-directory: ./EVO-LOG-backend
      env:
        DATABASE_URL: postgresql+asyncpg://EVO-LOG:EVO-LOG_secret@localhost:5432/EVO-LOG_test
        REDIS_URL: redis://localhost:6379/0
        JWT_SECRET_KEY: test_secret_key
      run: |
        pytest tests/unit -v

  frontend-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ./EVO-LOG-frontend/package-lock.json
        
    - name: Install dependencies
      working-directory: ./EVO-LOG-frontend
      run: npm ci
      
    - name: Lint and Build
      working-directory: ./EVO-LOG-frontend
      env:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXTAUTH_SECRET: test_secret_key
        NEXTAUTH_URL: http://localhost:3000
      run: |
        npm run lint
        npm run build
